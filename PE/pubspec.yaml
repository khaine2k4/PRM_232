name: shop_app
description: "Product Management & Shopping Cart App (Flutter + JSON Server REST API)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.2

  # Routing
  go_router: ^14.2.7

  # REST API client
  http: ^1.2.2

  # Login session / Remember Me
  shared_preferences: ^2.2.3

  # Password hashing
  crypto: ^3.0.3

  # Date/time & currency formatting
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
